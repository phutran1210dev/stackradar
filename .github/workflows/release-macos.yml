name: Release (macOS)

# Adds the macOS universal build (Apple Silicon + Intel, merged with lipo) to a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Package and upload
        run: |
          mkdir -p dist
          lipo -create -output dist/stackradar \
            target/aarch64-apple-darwin/release/stackradar target/x86_64-apple-darwin/release/stackradar
          lipo -info dist/stackradar
          name="stackradar-macos-universal"
          tar -czf "$name.tar.gz" -C dist stackradar
          versioned="stackradar-$TAG-macos-universal.tar.gz"
          cp "$name.tar.gz" "$versioned"
          shasum -a 256 "$versioned" > "$versioned.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$versioned" "$versioned.sha256" --clobber
