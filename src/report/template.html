<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Radar</title>

<script>
// Before first paint, so a chosen theme never flashes. Storage can fail; then the system theme applies.
try { const t = localStorage.getItem("stackradar:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
/* =====================================================================
   Stack Radar design system v3: "Field ledger"
   Achromatic chrome, one data hue, severity as pale pairs with a solid dot.
   Layers: 1 scales, 2 roles (light / dark), 3 base, 4 components. Pages use roles only.
   ===================================================================== */

/* ---------- 1. Scales ---------- */
:root {
  /* Slate: cool neutrals, from theme-factory "Modern Minimalist" (charcoal #36454f, slate #708090) moved to 4.5:1 */
  --slate-0: #ffffff; --slate-25: #f6f7f9; --slate-50: #f2f4f7; --slate-100: #eceef2; --slate-150: #e4e7ec;
  --slate-200: #d6dae1; --slate-300: #8b93a1; --slate-400: #6b7280; --slate-500: #545b68; --slate-700: #2b303a;
  --slate-900: #111318; --slate-950: #0b0d12;
  /* Neutral darks: true greys, never navy */
  --dark-0: #0a0a0a; --dark-1: #141414; --dark-2: #1c1c1c; --dark-3: #262626; --dark-4: #2e2e2e; --dark-5: #6b6b6b;
  --dark-6: #949494; --dark-7: #b4b4b4; --dark-8: #f5f5f5;
  /* Ledger blue: the one data hue (dealt by design-taste-frontend achromatic-ledger) */
  --blue-500: #1d5fbf; --blue-300: #6c9cf0; --blue-50: #e8f0fc; --blue-900: #142338;
  /* Severity: solid dots (marks) and pale pairs (pills) */
  --rose-600: #be123c; --rose-400: #fb7185; --rose-50: #ffe4e6; --rose-900: #881337; --rose-950: #3b1219; --rose-200: #fda4af;
  --orange-600: #ea580c; --orange-400: #fb923c; --orange-50: #ffedd5; --orange-900: #7c2d12; --orange-950: #3a1d0c; --orange-200: #fdba74;
  --amber-600: #ca8a04; --amber-400: #facc15; --amber-50: #fef3c7; --amber-900: #713f12; --amber-950: #36290a; --amber-200: #fcd34d;
}

/* ---------- 2a. Roles: light ---------- */
:root, .t-light {
  color-scheme: light;
  --ground: var(--slate-50);       /* blue-grey ledger paper: the product's face */
  --surface: var(--slate-0);
  --raised: var(--slate-25);       /* wells, hover */
  --active: var(--slate-100);      /* selected nav pill, pressed */
  --border: var(--slate-150);      /* card edges */
  --rule: var(--slate-100);        /* row rules */
  --control: var(--slate-300);     /* control borders, 3.1:1 */
  --text: var(--slate-950);        /* 17.6:1 on ground */
  --muted: var(--slate-500);       /* 6.2:1 on ground, 6.8:1 on surface */
  --faint: var(--slate-400);       /* surfaces only: 4.8:1 on surface, 4.5:1 on raised */
  --primary: var(--slate-900); --on-primary: #ffffff;
  --hue: var(--blue-500); --hue-soft: var(--blue-50);    /* buzz, trends: the main data element */
  --negative: #c4242a; --positive: #247b50;
  --notice-bg: #fffbeb; --notice-border: #fde68a; --notice-ink: #92400e;
  --sev-dot-critical: var(--rose-600); --sev-dot-high: var(--orange-600); --sev-dot-medium: var(--amber-600); --sev-dot-low: var(--slate-400);
  --sev-bg-critical: var(--rose-50); --sev-ink-critical: var(--rose-900);
  --sev-bg-high: var(--orange-50); --sev-ink-high: var(--orange-900);
  --sev-bg-medium: var(--amber-50); --sev-ink-medium: var(--amber-900);
  --sev-bg-low: var(--slate-100); --sev-ink-low: var(--slate-700);
  --sev-bg-malware: var(--slate-900); --sev-ink-malware: #ffffff;
  --float: 0 8px 24px rgba(17, 19, 24, .14), 0 1px 3px rgba(17, 19, 24, .08);
}

/* ---------- 2b. Roles: dark (true neutral) ---------- */
:root[data-theme="dark"], .t-dark {
  color-scheme: dark;
  --ground: var(--dark-0); --surface: var(--dark-1); --raised: var(--dark-2); --active: var(--dark-3);
  --border: var(--dark-3); --rule: #1f1f1f; --control: var(--dark-5);
  --text: var(--dark-8); --muted: var(--dark-7); --faint: var(--dark-6);
  --primary: var(--dark-8); --on-primary: var(--dark-0);
  --hue: var(--blue-300); --hue-soft: var(--blue-900);
  --negative: #f0686f; --positive: #3fc07a;
  --notice-bg: #2a2108; --notice-border: #5c4a12; --notice-ink: var(--amber-200);
  --sev-dot-critical: var(--rose-400); --sev-dot-high: var(--orange-400); --sev-dot-medium: var(--amber-400); --sev-dot-low: var(--dark-6);
  --sev-bg-critical: var(--rose-950); --sev-ink-critical: var(--rose-200);
  --sev-bg-high: var(--orange-950); --sev-ink-high: var(--orange-200);
  --sev-bg-medium: var(--amber-950); --sev-ink-medium: var(--amber-200);
  --sev-bg-low: var(--dark-3); --sev-ink-low: #d4d4d4;
  --sev-bg-malware: var(--dark-8); --sev-ink-malware: var(--dark-0);
  --float: 0 12px 32px rgba(0, 0, 0, .6), 0 0 0 1px var(--dark-4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: var(--dark-0); --surface: var(--dark-1); --raised: var(--dark-2); --active: var(--dark-3);
    --border: var(--dark-3); --rule: #1f1f1f; --control: var(--dark-5);
    --text: var(--dark-8); --muted: var(--dark-7); --faint: var(--dark-6);
    --primary: var(--dark-8); --on-primary: var(--dark-0);
    --hue: var(--blue-300); --hue-soft: var(--blue-900);
    --negative: #f0686f; --positive: #3fc07a;
    --notice-bg: #2a2108; --notice-border: #5c4a12; --notice-ink: var(--amber-200);
    --sev-dot-critical: var(--rose-400); --sev-dot-high: var(--orange-400); --sev-dot-medium: var(--amber-400); --sev-dot-low: var(--dark-6);
    --sev-bg-critical: var(--rose-950); --sev-ink-critical: var(--rose-200);
    --sev-bg-high: var(--orange-950); --sev-ink-high: var(--orange-200);
    --sev-bg-medium: var(--amber-950); --sev-ink-medium: var(--amber-200);
    --sev-bg-low: var(--dark-3); --sev-ink-low: #d4d4d4;
    --sev-bg-malware: var(--dark-8); --sev-ink-malware: var(--dark-0);
    --float: 0 12px 32px rgba(0, 0, 0, .6), 0 0 0 1px var(--dark-4);
  }
}

/* ---------- 2c. Type, space, shape, motion ---------- */
:root {
  --font: "Geist", system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
  /* Five sizes: 12 / 14 / 16 / 24 / 30 */
  --fs-small: 13px; --lh-small: 18px;  --fs-micro: 12px;
  --fs-body: 14px;  --lh-body: 20px;
  --fs-section: 16px; --lh-section: 24px;
  --fs-title: 24px; --lh-title: 30px;
  --fs-figure: 30px; --lh-figure: 36px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px; --s16: 64px;
  --gap: 16px;                     /* the one gutter, both directions */
  --pad: 20px;                     /* card padding */
  --radius-card: 8px; --radius-control: 6px; --radius-chip: 4px; --radius-pill: 999px;
  --control-h: 32px; --row-min: 44px; --bar-h: 48px;
  --col: 1120px;                   /* 752 + 16 + 352 = 1120 */
  --rail: 352px;
  --t-fast: 120ms; --t-state: 200ms; --t-leave: 240ms; --ease: cubic-bezier(.2, .7, .2, 1);
}

/* ---------- 3. Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font: var(--fs-body)/var(--lh-body) var(--font); font-variant-numeric: tabular-nums; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
button, input, select { font: inherit; color: inherit; }
code, kbd, .mono { font-family: var(--mono); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--hue); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 14px; height: 14px; }

/* ---------- 4. Viewer bar ---------- */
.bar { height: var(--bar-h); border-bottom: 1px solid var(--border); background: var(--ground); }
.bar-in { max-width: calc(var(--col) + 2 * var(--s6)); height: 100%; margin: 0 auto; padding: 0 var(--s6); display: flex; align-items: center; gap: var(--s4); }
.mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.mark svg { width: 22px; height: 22px; }
.scope { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.scope::before { content: "/"; margin-right: var(--s4); color: var(--control); }
.bar .spacer { flex: 1; }
.stamp { color: var(--muted); white-space: nowrap; }
.switch { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--radius-control); border: 1px solid var(--border); }
.switch button { border: 0; background: none; height: 26px; width: 30px; border-radius: 4px; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.switch button:hover { color: var(--text); }
.switch button[aria-pressed="true"] { background: var(--active); color: var(--text); }
@media (max-width: 759px) { .bar-in { padding: 0 var(--s4); } .stamp, .scope { display: none; } }

/* ---------- 5. Canvas and title row ---------- */
.canvas { max-width: calc(var(--col) + 2 * var(--s6)); margin: 0 auto; padding: var(--s8) var(--s6) var(--s16); }
@media (max-width: 759px) { .canvas { padding: var(--s5) var(--s4) var(--s12); } }
.title-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--s4) var(--s8); }
.title-row .head { flex: 1 1 520px; min-width: 0; display: grid; gap: var(--s2); }
h1.verdict { margin: 0; font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; letter-spacing: -.01em; max-width: 46ch; text-wrap: balance; }
h1.verdict .keep { white-space: nowrap; }
.subline { margin: 0; color: var(--muted); max-width: 80ch; }
.title-row .actions { display: flex; gap: var(--s2); flex: none; }
@media (max-width: 759px) { h1.verdict { font-size: 20px; line-height: 26px; } .title-row .actions, .title-row .actions .btn { width: 100%; } .title-row .actions .btn { justify-content: center; } }

/* ---------- 6. Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: var(--s2); height: var(--control-h); padding: 0 var(--s3); border-radius: var(--radius-control);
  border: 1px solid var(--control); background: var(--surface); color: var(--text); cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { opacity: .88; }
.btn.done .icon { color: var(--positive); }
.btn.primary.done .icon { color: inherit; }
.ghost { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--s2); border: 0; border-radius: var(--radius-control);
  background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.ghost:hover { background: var(--raised); color: var(--text); }
.ghost[aria-pressed="true"] { color: var(--text); }
.ghost.save[aria-pressed="true"] .icon { fill: currentColor; }

/* ---------- 7. Notice (stale, partial, section note) ---------- */
.notice { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: var(--s2); padding: 9px var(--s3); border-radius: var(--radius-control);
  background: var(--notice-bg); border: 1px solid var(--notice-border); color: var(--notice-ink); font-size: var(--fs-small); line-height: var(--lh-small); }
.notice .icon { width: 14px; height: 14px; margin-top: 1px; }
.notice p { margin: 0; }
.notice b { font-weight: 600; }
.notice code { font-size: 12px; }
.notice details summary { cursor: pointer; font-weight: 600; }
.notice ul { margin: var(--s1) 0 0; padding-left: 16px; }
.notices { display: grid; gap: var(--s2); }

/* ---------- 8. Summary strip (KPIs as type, one divided container) ---------- */
.strip { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); margin-top: var(--s6); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-card); }
.cell { padding: var(--s4) var(--pad); display: grid; gap: var(--s1); align-content: start; min-width: 0; }
.cell + .cell { border-left: 1px solid var(--border); }
.cell .label { color: var(--muted); font-size: var(--fs-small); line-height: var(--lh-small); }
.cell .value { font-size: var(--fs-figure); line-height: var(--lh-figure); font-weight: 500; letter-spacing: -.01em; }
.cell .value small { font-size: var(--fs-body); color: var(--faint); font-weight: 400; margin-left: 4px; letter-spacing: 0; }
.cell .note { color: var(--muted); font-size: var(--fs-small); line-height: var(--lh-small); }
.cell .note.bad { color: var(--negative); }
.cell .counts { margin-top: var(--s1); }
@media (max-width: 759px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell + .cell { border-left: 0; }
  .cell:nth-child(even) { border-left: 1px solid var(--border); }
  .cell:nth-child(n+3) { border-top: 1px solid var(--border); }
  .cell:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .cell .value { font-size: 24px; line-height: 30px; }
}

/* ---------- 9. Tabs ---------- */
.tabs { display: flex; gap: var(--s5); margin-top: var(--s8); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; border: 0; background: none; padding: 10px 0 12px; cursor: pointer; color: var(--muted); white-space: nowrap; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); }
.tab .n { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.tab .dot { width: 6px; height: 6px; border-radius: 50%; }
.tab-sep { flex: none; width: 1px; margin: 12px 0; background: var(--border); }

/* ---------- 10. Layout below the tabs ---------- */
.work { display: grid; gap: var(--gap); margin-top: var(--gap); align-items: start; }
.work > * { min-width: 0; }
@media (min-width: 1100px) { .work.with-rail { grid-template-columns: minmax(0, 1fr) var(--rail); } }

/* ---------- 11. Card ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); padding: var(--s4) var(--pad) var(--s3); }
.card-head h2 { margin: 0; font-size: var(--fs-section); line-height: var(--lh-section); font-weight: 600; margin-right: auto; }
.card-head .count { color: var(--faint); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
.card-sub { margin: calc(var(--s2) * -1) var(--pad) var(--s3); color: var(--muted); font-size: var(--fs-small); line-height: var(--lh-small); }
.card-foot { padding: var(--s3) var(--pad); border-top: 1px solid var(--rule); color: var(--muted); font-size: var(--fs-small); }
.rail { display: grid; gap: var(--gap); }
@media (min-width: 1100px) { .rail { position: sticky; top: var(--s4); } }

/* ---------- 12. Filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding: 0 var(--pad) var(--s3); }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search input { width: 100%; height: var(--control-h); padding: 0 34px 0 32px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); }
.search input::placeholder { color: var(--faint); }
.search .icon { position: absolute; left: 10px; top: 8px; color: var(--faint); }
.search kbd { position: absolute; right: 8px; top: 7px; font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid var(--border); border-radius: 4px; color: var(--faint); }
.select { position: relative; }
.select select { appearance: none; height: var(--control-h); padding: 0 28px 0 10px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); cursor: pointer; }
.select .icon { position: absolute; right: 8px; top: 9px; pointer-events: none; color: var(--faint); width: 14px; height: 14px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius-control); background: var(--active); }
.seg button { border: 1px solid transparent; background: none; height: 28px; padding: 0 10px; border-radius: 4px; color: var(--muted); cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--border); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 var(--pad) var(--s3); }
.chip { height: 26px; padding: 0 10px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; font-size: var(--fs-small); }
.chip:hover { color: var(--text); border-color: var(--control); }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
.filters .result { margin-left: auto; color: var(--faint); font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
@media (max-width: 759px) { .search { max-width: none; flex-basis: 100%; } .filters .select, .filters .seg { flex: 1 1 auto; } .filters .select select { width: 100%; } .seg button { flex: 1; } .search kbd { display: none; } }

/* ---------- 13. Group header inside a list ---------- */
.group { display: flex; align-items: baseline; gap: var(--s2); padding: var(--s4) var(--pad) var(--s2); border-top: 1px solid var(--rule); }
.group:first-child { border-top: 0; padding-top: var(--s1); }
.group h3 { margin: 0; font-size: var(--fs-body); font-weight: 600; }
.group .n { color: var(--faint); font-variant-numeric: tabular-nums; }
.group p { margin: 0; color: var(--muted); font-size: var(--fs-small); }

/* ---------- 14. Severity pill, count cells, flags ---------- */
.sev { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--radius-pill); font-size: var(--fs-small); font-weight: 500;
  white-space: nowrap; flex: none; background: var(--sev-bg-low); color: var(--sev-ink-low); }
.sev::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--sev-dot-low); }
.sev.critical { background: var(--sev-bg-critical); color: var(--sev-ink-critical); } .sev.critical::before { background: var(--sev-dot-critical); }
.sev.high { background: var(--sev-bg-high); color: var(--sev-ink-high); } .sev.high::before { background: var(--sev-dot-high); }
.sev.medium { background: var(--sev-bg-medium); color: var(--sev-ink-medium); } .sev.medium::before { background: var(--sev-dot-medium); }
.sev.unknown { background: var(--raised); color: var(--muted); } .sev.unknown::before { background: var(--faint); opacity: .5; }
.sev.malware { background: var(--sev-bg-malware); color: var(--sev-ink-malware); } .sev.malware::before { display: none; }
.sev .cvss { opacity: .8; font-variant-numeric: tabular-nums; }
.counts { display: inline-flex; gap: 3px; }
.cnt { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 32px; height: 20px; padding: 0 5px; border-radius: var(--radius-chip);
  font-size: var(--fs-micro); font-variant-numeric: tabular-nums; background: var(--sev-bg-low); color: var(--sev-ink-low); }
.cnt b { font-weight: 600; }
.cnt i { font-style: normal; opacity: .75; }
.cnt.critical { background: var(--sev-bg-critical); color: var(--sev-ink-critical); }
.cnt.high { background: var(--sev-bg-high); color: var(--sev-ink-high); }
.cnt.medium { background: var(--sev-bg-medium); color: var(--sev-ink-medium); }
.cnt.malware { background: var(--sev-bg-malware); color: var(--sev-ink-malware); }
.cnt.zero { background: none; color: var(--faint); }
.flag { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-small); white-space: nowrap; color: var(--muted); }
.flag .icon { width: 13px; height: 13px; }
.flag.bad { color: var(--negative); font-weight: 500; }
.flag.new { color: var(--hue); font-weight: 500; }

/* ---------- 15. Finding row (upgrade, advisory, unmaintained) ---------- */
.rows { list-style: none; margin: 0; padding: 0; }
.finding { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: var(--s1) var(--s4); padding: var(--s4) var(--pad); border-top: 1px solid var(--rule); }
.group + .rows > .finding:first-child { border-top: 0; }
.finding:hover { background: var(--raised); }
.finding .sevcell { padding-top: 1px; display: grid; gap: 6px; align-content: start; justify-items: start; }
.finding .body { min-width: 0; display: grid; gap: 6px; }
.finding .line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--s3); }
.finding .pkg { font-weight: 600; font-size: var(--fs-section); overflow-wrap: anywhere; text-decoration: none; }
a.pkg:hover { text-decoration: underline; }
.ver { font-family: var(--mono); /* taste-skill-ignore: versions are literal code */ font-size: 13px; color: var(--muted); white-space: nowrap; }
.ver .to { color: var(--text); font-weight: 600; }
.ver .none { font-family: var(--font); color: var(--text); font-weight: 600; }
.prov { margin: 0; color: var(--muted); }
.prov code { color: var(--text); font-size: 12.5px; }
.caveats { display: flex; flex-wrap: wrap; gap: 2px var(--s4); margin: 0; padding: 0; list-style: none; }
.finding .end { display: flex; align-items: flex-start; gap: var(--s1); }
.finding.leaving { animation: leave var(--t-leave) var(--ease) forwards; }
.finding.flash { animation: flash 1.4s var(--ease); }
@keyframes leave { to { opacity: 0; transform: translateX(8px); } }
@keyframes flash { 0%, 40% { background: var(--hue-soft); } 100% { background: transparent; } }
@media (max-width: 759px) {
  .finding { grid-template-columns: minmax(0, 1fr) auto; padding: var(--s4); }
  .finding .sevcell { grid-auto-flow: column; justify-content: start; align-items: center; }
  .finding .body { grid-column: 1 / -1; grid-row: 2; }
  .finding .end { grid-column: 2; grid-row: 1; }
}

/* ---------- 16. Command well ---------- */
.cmd { display: flex; max-width: 600px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--raised); overflow: hidden; }
.cmd code { flex: 1; min-width: 0; padding: 6px 10px; white-space: pre; overflow-x: auto; scrollbar-width: thin; line-height: 20px; }
.cmd code::before { content: "$ "; color: var(--faint); user-select: none; }
.cmd button { flex: none; border: 0; border-left: 1px solid var(--border); background: none; color: var(--muted); padding: 0 10px; min-width: 78px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; font-size: var(--fs-small); }
.cmd button:hover { color: var(--text); background: var(--active); }
.cmd button.done { color: var(--positive); }

/* ---------- 17. Disclosure + table ---------- */
.more summary { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; color: var(--muted); list-style: none; width: fit-content; font-size: var(--fs-small); }
.more summary::-webkit-details-marker { display: none; }
.more summary:hover { color: var(--text); }
.more summary .icon { width: 14px; height: 14px; transition: transform var(--t-fast) var(--ease); }
.more[open] summary .icon { transform: rotate(90deg); }
.more .body2 { margin-top: var(--s2); overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--fs-small); line-height: var(--lh-small); }
table.t th { text-align: left; font-weight: 400; color: var(--faint); padding: 0 var(--s3) 6px 0; white-space: nowrap; }
table.t td { padding: 8px var(--s3) 8px 0; border-top: 1px solid var(--rule); vertical-align: top; color: var(--muted); }
table.t td.id { font-family: var(--mono); /* taste-skill-ignore: advisory ids and paths */ white-space: nowrap; color: var(--text); }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
table.t td.wide { min-width: 24ch; color: var(--text); }
table.t td.nowrap { white-space: nowrap; }

/* ---------- 18. Projects table (signature: severity count cells per project) ---------- */
.ptable { width: 100%; border-collapse: collapse; }
.ptable th { text-align: left; font-weight: 400; font-size: var(--fs-small); color: var(--faint); padding: 0 var(--pad) 6px; }
.ptable th.n { text-align: right; }
.ptable td { padding: 0 var(--pad); height: var(--row-min); border-top: 1px solid var(--rule); }
.ptable td.n { text-align: right; }
.ptable tr.pick { cursor: pointer; }
.ptable tr.pick:hover td { background: var(--raised); }
.ptable tr[aria-selected="true"] td { background: var(--active); }
.ptable .pname { font-family: var(--mono); /* taste-skill-ignore: project folder names */ font-size: 13px; }
.ptable button.pbtn { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; }

/* ---------- 19. Repo row (leaderboard) ---------- */
.repo { display: grid; grid-template-columns: 28px 32px minmax(0, 1fr) 120px 148px; gap: var(--s1) var(--s4); padding: var(--s4) var(--pad); border-top: 1px solid var(--rule); align-items: start; }
.repo:hover { background: var(--raised); }
.repo .rank { font-size: var(--fs-section); line-height: 32px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; position: relative; }
.repo.unseen .rank { color: var(--text); font-weight: 600; }
.repo.unseen .rank::before { content: ""; position: absolute; right: calc(100% + 4px); /* in the row's padding, clear of any rank */ top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--hue); }
.initials { width: 32px; height: 32px; border-radius: var(--radius-control); display: grid; place-items: center; font-size: 12px; font-weight: 600;
  background: hsl(var(--h) 40% 92%); color: hsl(var(--h) 35% 26%); }
.t-dark .initials, :root[data-theme="dark"] .initials { background: hsl(var(--h) 22% 18%); color: hsl(var(--h) 40% 80%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .initials { background: hsl(var(--h) 22% 18%); color: hsl(var(--h) 40% 80%); } }
.t-light .initials { background: hsl(var(--h) 40% 92%); color: hsl(var(--h) 35% 26%); }
.repo .main { min-width: 0; display: grid; gap: 4px; }
.repo .name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--s3); font-size: var(--fs-section); line-height: var(--lh-section); }
.repo .name a { text-decoration: none; overflow-wrap: anywhere; }
.repo .name a:hover { text-decoration: underline; }
.repo .name .owner { color: var(--muted); }
.repo .name b { font-weight: 600; }
.repo .desc { margin: 0; color: var(--muted); max-width: 70ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.repo .desc.missing { color: var(--faint); font-style: italic; }
.why { display: flex; flex-wrap: wrap; gap: 2px var(--s4); margin: 2px 0 0; padding: 0; list-style: none; font-size: var(--fs-small); color: var(--text); }
.why li { display: inline-flex; align-items: center; gap: 5px; }
.why .icon { width: 13px; height: 13px; color: var(--muted); }
.why a { text-decoration: none; } .why a:hover { text-decoration: underline; }
.warns { display: grid; gap: 2px; margin: 4px 0 0; padding: 0; list-style: none; font-size: var(--fs-small); color: var(--negative); }
.warns li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; }
.warns .icon { width: 13px; height: 13px; margin-top: 2px; }
.warns span { color: var(--muted); } .warns b { color: var(--negative); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: 2px var(--s4); margin: 2px 0 0; padding: 0; list-style: none; font-size: var(--fs-small); color: var(--faint); }
.meta .lang::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--lang, var(--faint)); }
.buzz { display: grid; gap: 6px; padding-top: 4px; }
.buzz .v { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
.buzz .v b { font-size: var(--fs-section); font-weight: 600; font-variant-numeric: tabular-nums; }
.buzz .v span { font-size: var(--fs-small); color: var(--faint); }
.meter { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--hue); border-radius: 2px; }
.buzz.cut .meter i { background: var(--faint); }
.buzz.cut .v span { color: var(--negative); }
.stars { display: grid; gap: 2px; justify-items: end; padding-top: 4px; text-align: right; }
.stars b { font-size: var(--fs-section); font-weight: 600; font-variant-numeric: tabular-nums; }
.stars .gain { font-size: var(--fs-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.stars .gain.up { color: var(--text); }
.spark { display: block; overflow: visible; margin-top: 2px; }
.spark .line { fill: none; stroke: var(--hue); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.spark .end { fill: var(--hue); stroke: var(--surface); stroke-width: 1.5; }
.spark .base { stroke: var(--rule); stroke-width: 1; }
.repo .acts { grid-column: 3 / -1; display: flex; gap: var(--s1); margin: 2px 0 -6px -8px; }
.head-row { display: grid; grid-template-columns: 28px 32px minmax(0, 1fr) 120px 148px; gap: var(--s4); padding: 0 var(--pad) 6px; font-size: var(--fs-small); color: var(--faint); }
.head-row .r { text-align: right; }
@media (max-width: 899px) {
  .repo { grid-template-columns: 28px 32px minmax(0, 1fr) 96px; }
  .repo .buzz { display: none; }
  .head-row { grid-template-columns: 28px 32px minmax(0, 1fr) 96px; }
  .head-row .hb { display: none; }
}
@media (max-width: 559px) {
  .repo { grid-template-columns: 28px minmax(0, 1fr) auto; padding: var(--s4); gap: var(--s1) var(--s3); }
  .repo .initials { display: none; }
  .repo .stars { padding-top: 0; }
  .repo .acts { grid-column: 2 / -1; }
  .head-row { display: none; }
}

/* ---------- 20. Empty state ---------- */
.empty { margin: 0 var(--pad) var(--pad); padding: var(--s8) var(--s6); border: 1px dashed var(--control); border-radius: var(--radius-card); text-align: center; display: grid; gap: 6px; justify-items: center; }
.empty .icon { width: 20px; height: 20px; color: var(--faint); }
.empty h3 { margin: 0; font-size: var(--fs-section); font-weight: 600; }
.empty p { margin: 0; color: var(--muted); max-width: 56ch; }

/* ---------- 21. Toast, tooltip ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; display: flex; gap: var(--s4); align-items: center;
  padding: 8px 8px 8px 14px; border-radius: var(--radius-card); background: var(--primary); color: var(--on-primary); box-shadow: var(--float); /* taste-skill-ignore: the toast floats */
  animation: toast-in var(--t-state) var(--ease); max-width: calc(100vw - 32px); }
.toast button { border: 0; border-radius: var(--radius-control); height: 28px; padding: 0 10px; background: rgba(127, 127, 127, .25); color: inherit; cursor: pointer; font-weight: 600; }

/* ---------- 22. Explainer ---------- */
.explain { margin-top: var(--s10); display: grid; gap: var(--s3); color: var(--muted); }
.explain h2 { margin: 0; font-size: var(--fs-section); font-weight: 600; color: var(--text); }
.explain dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--s2) var(--s6); margin: 0; max-width: 92ch; }
.explain dt { color: var(--text); font-weight: 500; }
.explain dd { margin: 0; }
.explain .keys { margin: 0; font-size: var(--fs-small); color: var(--faint); }
.explain kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; border: 1px solid var(--border); border-radius: 4px; }
@media (max-width: 759px) { .explain dl { grid-template-columns: 1fr; gap: 0; } .explain dd { margin-bottom: var(--s3); } }

/* ---------- 23. Guards ---------- */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (forced-colors: active) { .sev, .cnt, .meter i { border: 1px solid CanvasText; forced-color-adjust: none; } }
@media print { .bar .switch, .filters, .chips, .ghost, .cmd button, .title-row .actions, .toast { display: none !important; } body { background: #fff; } }

/* ---------- 24. Variants ---------- */
/* Rail rows: severity on its own line, body full width */
.rail .finding { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.rail .finding .sevcell { grid-auto-flow: column; justify-content: start; }
.rail .finding .end { display: none; }
/* Neutral notice for facts that need no action */
.notice.info { background: var(--raised); border-color: var(--border); color: var(--muted); }
.notice.info b { color: var(--text); }
.counts { flex-wrap: wrap; }
/* In the project table the name wraps, never the counts: one row per project */
.ptable td.n { width: 1%; white-space: nowrap; } .ptable .counts { flex-wrap: nowrap; }
.ptable .pname { overflow-wrap: anywhere; }
.caveats .flag { white-space: normal; align-items: flex-start; }
.caveats .flag .icon { margin-top: 2px; }
@media (max-width: 759px) {
  .group { flex-wrap: wrap; }
  .group p { flex-basis: 100%; }
}
@media (max-width: 559px) {
  .repo { grid-template-columns: 28px minmax(0, 1fr); }
  .repo .stars { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 4px 10px; text-align: left; padding-top: 0; }
  .repo .stars b { font-size: var(--fs-body); }
  .repo .name a { overflow-wrap: normal; }
  .repo .name b { overflow-wrap: anywhere; } /* a long name breaks rather than run off a phone */
}

/* ---------- 25. Overview (round 2): the finding and the signature side by side ---------- */
.overview { display: grid; gap: var(--s6) var(--s10); align-items: start; }
@media (min-width: 1100px) { .overview { grid-template-columns: minmax(0, 1fr) 440px; } }
.overview .lead { display: grid; gap: var(--s3); min-width: 0; }
.overview .lead .actions { display: flex; gap: var(--s2); margin-top: var(--s1); }
.lede { margin: 0; font-size: var(--fs-section); line-height: var(--lh-section); max-width: 60ch; }
.overview .strip { margin-top: var(--s3); }
.overview .cell .value { font-size: var(--fs-title); line-height: var(--lh-title); }
.side-card .card-head { padding-bottom: var(--s2); }
.side-card .ptable td { height: 40px; }
.top-list { list-style: none; margin: 0; padding: 0; }
.top-list li { display: grid; grid-template-columns: 20px minmax(0, 1fr) 96px; gap: var(--s3); align-items: center; padding: 0 var(--pad); height: 44px; border-top: 1px solid var(--rule); }
.top-list .r { color: var(--faint); text-align: right; }
.top-list a { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-list a:hover { text-decoration: underline; }
@media (max-width: 759px) { .overview .lead .actions, .overview .lead .actions .btn { width: 100%; } .overview .lead .actions .btn { justify-content: center; } }

/* ---------- 26. Finding row with a fix column (round 2): commands line up on one edge ---------- */
@media (min-width: 1100px) {
  .finding { grid-template-columns: 96px minmax(0, 1fr) 380px auto; }
  .finding .fixcol { grid-column: 3; grid-row: 1; padding-top: 2px; min-width: 0; }

  .finding .end { grid-column: 4; }
}
@media (max-width: 1099px) { .finding .fixcol { grid-column: 2; } }
@media (max-width: 759px) { .finding .fixcol { grid-column: 1 / -1; } }
.fixcol .fixnote { margin: 0; color: var(--muted); font-size: var(--fs-small); line-height: var(--lh-small); padding: 7px 0; }
.fixcol table.t td { padding-top: 6px; padding-bottom: 6px; }
/* Round 2 refinements: the lead column ends level with the By project card */
.notices { margin: 0 0 var(--s6); }
@media (min-width: 1100px) {
  .overview { align-items: stretch; }
  .overview .lead { display: flex; flex-direction: column; gap: var(--s3); }
  .overview .lead .actions { margin-bottom: var(--s3); }

}

@media (min-width: 1100px) { .finding { grid-template-columns: 96px minmax(0, 1fr) 400px auto; } }

  } else if (wantDismissed || state.severity || state.q || state.project || state.topics.size) {
    add(card, el("ul", { class: "rows" }, rows.map(rowFor)));
  } else {
    const body = el("div", {});
    for (const [title, sub, test] of BANDS) {
      const band = rows.filter(test);
      if (!band.length) continue;
      add(body, el("div", { class: "group" }, el("h3", { text: title }), el("span", { class: "n", text: fmtNum.format(band.length) }), sub ? el("p", { text: sub }) : null),
        el("ul", { class: "rows" }, band.map(rowFor)));
    }
    add(card, body);
  }
  const stale = wantDismissed || state.severity || state.project ? [] : (VULNS.unmaintained ?? []).filter((d) => !state.topics.size || state.topics.has(d.ecosystem)).filter((d) => !q || [d.package, d.repo, ...d.projects].some(has));
  if (stale.length) add(card, el("div", { class: "group" }, el("h3", { text: "Unmaintained" }), el("span", { class: "n", text: fmtNum.format(stale.length) }), el("p", { text: "No advisories, but nobody will fix the next one." })),
    el("ul", { class: "rows" }, stale.map(unmaintainedRow)));
  if (VULNS.ignored) add(card, el("div", { class: "card-foot", text: `${plural(VULNS.ignored, "advisory is", "advisories are")} left out by ${IGNORE_SOURCE}.` }));
  panel.className = "work";
  add(panel, card);
}

// ---------- Repos ----------
const sorters = {
  buzz: (a, b) => b.buzz - a.buzz || b.stars_per_day - a.stars_per_day, spd: (a, b) => b.stars_per_day - a.stars_per_day,
  gained: (a, b) => (b.stars_delta ?? -Infinity) - (a.stars_delta ?? -Infinity) || b.stars_per_day - a.stars_per_day,
  stars: (a, b) => b.stargazers_count - a.stargazers_count, new: (a, b) => b.created_at.localeCompare(a.created_at),
};
const signalFilters = { "": () => true, trending: (r) => r.trending_today != null, hn: (r) => r.hn != null,
  engaged: (r) => !r.low_engagement && !r.suspicious_stars, unseen: isUnseen, dismissed: () => true };
const SECTION_COPY = { foryou: "Repos that match your projects' dependencies, ranked by buzz.", watch: "The repos you follow in your config, ranked by buzz.", saved: "Repos you saved in this browser, while they stay in the report." };
function renderRepos(panel) {
  const sec = sectionByKey(state.tab) ?? DATA[0], wantDismissed = state.signal === "dismissed";
  const pool = sec.entries.filter((r) => dismissed.has(r.full_name) === wantDismissed);
  const q = state.q.toLowerCase();
  const langs = new Map(); for (const e of sec.entries) if (e.language) langs.set(e.language, (langs.get(e.language) ?? 0) + 1);
  if (state.lang && !langs.has(state.lang)) state.lang = "";
  const rows = pool.filter((r) => !state.topics.size || r.matched.some((t) => state.topics.has(t))).filter((r) => !state.lang || r.language === state.lang)
    .filter(signalFilters[state.signal]).filter((r) => !q || [r.full_name, r.description, r.language, ...r.topics].some((v) => v && v.toLowerCase().includes(q))).sort(sorters[state.sort]);
  const maxBuzz = Math.max(1, ...sec.entries.map((e) => e.buzz));
  const card = el("section", { class: "card", "aria-labelledby": "list-title" },
    el("div", { class: "card-head" }, el("h2", { id: "list-title" }, sec.title, el("span", { class: "count", text: fmtNum.format(pool.length) }))),
    el("p", { class: "card-sub", text: SECTION_COPY[sec.key] ?? `Repos tagged ${sec.topics.join(", ")}, created since ${shortDate(REPORT.since)} or on GitHub Trending, ranked by buzz.` }));
  if (sec.note) add(card, el("div", { style: "padding:0 var(--pad) var(--s3)" }, notice({ iconName: "alert", title: "Read the code before you run anything here.", body: sec.note })));
  add(card, el("div", { class: "filters" },
      searchField("Name, description or language", state.q, (v) => { state.q = v; renderPanel(); }),
      selectField("Show", [["", "All repos"], ["trending", "On GitHub Trending"], ["hn", "On Hacker News"], ["engaged", "Without star warnings"], ["unseen", "New to you"], ["dismissed", "Dismissed"]], state.signal, (v) => { state.signal = v; renderPanel(); }),
      selectField("Language", [["", "Any language"], ...[...langs].sort((a, b) => b[1] - a[1]).map(([l, n]) => [l, `${l} (${n})`])], state.lang, (v) => { state.lang = v; renderPanel(); }),
      selectField("Sort", [["buzz", "Sort by buzz"], ["spd", "Stars a day"], ...(COMPARED ? [["gained", "Stars gained"]] : []), ["stars", "Total stars"], ["new", "Newest"]], state.sort, (v) => { state.sort = v; renderPanel(); }),
      el("span", { class: "result", "aria-live": "polite", text: rows.length === pool.length ? plural(pool.length, "repo", "repos") : `${fmtNum.format(rows.length)} of ${plural(pool.length, "repo", "repos")}` })),
    sec.topics.length ? chipGroup("Topic", sec.topics.map((t) => [t, t]), state.topics, (t) => { state.topics.has(t) ? state.topics.delete(t) : state.topics.add(t); renderPanel(); }) : null);
  if (!rows.length) {
    const [ic, t, b] = wantDismissed && !pool.length ? ["x", "Nothing dismissed", "Dismiss a repo to hide it from every tab. It waits here so you can restore it."]
      : sec.key === "saved" && !pool.length ? ["star", "No saved repos yet", "Save a repo from any tab to keep it here while it stays in the report."]
      : !pool.length ? ["trend", "No repos in this tab", "Nothing in these topics passed the star and age thresholds this run."]
      : ["filter", "No repos match", "Clear the search or the filters to see all of them."];
    add(card, emptyState(ic, t, b));
  } else add(card, repoHeadRow(), el("ol", { class: "rows", "aria-label": `${sec.title}, ranked` }, rows.map((r, i) => {
    const isSaved = saved.has(r.full_name), isDis = dismissed.has(r.full_name);
    const row = repoRow(r, { rank: i + 1, maxBuzz, compared: COMPARED, unseen: isUnseen(r), saved: isSaved, dismissed: isDis,
      onSave: () => { setAll(saved, SAVED_KEY, [r.full_name], !isSaved); render(); },
      onDismiss: () => isDis ? (setAll(dismissed, DISMISSED_KEY, [r.full_name], false), render()) : dismissWithUndo(row, [r.full_name], r.full_name) });
    return row;
  })));
  panel.className = "work";
  add(panel, card);
}

// ---------- Explainer ----------
function renderExplain() {
  const items = vulnView() ? [
    ["Upgrade", "The lowest version that fixes every advisory against the package. ≥ means no lockfile was found, so the version is the lowest the manifest allows."],
    ["Exploited", "In CISA's Known Exploited Vulnerabilities catalog: attackers are using it."],
    ["EPSS", "FIRST's estimate of the chance of exploitation in the next 30 days, shown from 1%."],
    ["C H M L", "Open advisories by severity: critical, high, medium, low. Malware is counted first, in black."],
    ["Source", `${VULNS.database}, matched against the versions in your lockfiles. Nothing from your projects was run.`],
  ] : [
    ["Buzz", "GitHub Trending today, plus recent Hacker News discussion, plus stars gained since the last run, plus stars a day. The bar compares a repo with the top repo in its tab."],
    ["Star warnings", "Buzz is halved for low engagement and cut to 30% when stars look bought; the bar turns grey."],
    ["Blue dot", "The first time this browser has seen the repo."],
    ["Sources", "GitHub's search and GraphQL APIs, github.com/trending, and Hacker News through Algolia."],
  ];
  $("explain").replaceChildren(el("h2", { text: "How to read this report" }), el("dl", {}, items.map(([t, d]) => [el("dt", { text: t }), el("dd", { text: d })])),
    el("p", { class: "keys" }, el("kbd", { text: "/" }), " search, ", el("kbd", { text: "Esc" }),
      ...(DATA.length ? [" clear, ", el("kbd", { text: "←" }), " ", el("kbd", { text: "→" }), " switch tabs. Saved, dismissed and seen repos stay in this browser."]
        : [" clear. Dismissed upgrades and advisories stay in this browser."])));
}

// ---------- URL hash ----------
function saveHash() {
  const p = new URLSearchParams({ tab: state.tab });
  for (const [k, d] of [["sort", "buzz"], ["lang", ""], ["signal", ""], ["severity", ""], ["group", "fix"], ["q", ""], ["project", ""]]) if (state[k] !== d) p.set(k, state[k]);
  if (state.topics.size) p.set("topics", [...state.topics].join(","));
  history.replaceState(null, "", "#" + p);
}
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (tabGroups().flat().some((t) => t.key === p.get("tab"))) state.tab = p.get("tab");
  if (sorters[p.get("sort")] && (p.get("sort") !== "gained" || COMPARED)) state.sort = p.get("sort");
  if (signalFilters[p.get("signal")]) state.signal = p.get("signal");
  if (["critical", "high", "medium", "dismissed"].includes(p.get("severity"))) state.severity = p.get("severity");
  if (p.get("group") === "advisory") state.group = "advisory";
  state.lang = p.get("lang") ?? ""; state.q = p.get("q") ?? ""; state.project = p.get("project") ?? "";
  state.topics = new Set((p.get("topics") ?? "").split(",").filter(Boolean));
}

function renderPanel() {
  const panel = $("panel"), focusQ = document.activeElement?.id === "q", caret = focusQ ? document.activeElement.selectionStart : 0;
  panel.replaceChildren();
  panel.setAttribute("aria-labelledby", "tab-" + state.tab);
  vulnView() ? renderVulns(panel) : renderRepos(panel);
  if (focusQ) { const q = $("q"); q.focus(); q.setSelectionRange(caret, caret); }
  saveHash(); renderExplain();
}
function render() { renderOverview(); renderTabs(); renderPanel(); }

document.addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("input, select, textarea");
  if (e.key === "/" && !typing) { e.preventDefault(); $("q")?.focus(); }
  else if (e.key === "Escape" && e.target.id === "q") { state.q = ""; renderPanel(); }
});

renderBar(); renderNotices();
if (DATA.length || VULNS) { loadHash(); render(); }
else { $("lead").replaceChildren(el("h1", { class: "verdict", text: "Nothing to report yet." }), el("p", { class: "lede", text: "No topics are configured and no projects were scanned. Run stackradar --init-config to start." })); }

</script>
